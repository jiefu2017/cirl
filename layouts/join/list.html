{{ define "main" }}
<article class="join-page">
  <h1>{{ .Title }}</h1>
  {{ .Content }}

  <h2>Contact</h2>
  <dl class="contact-details">
    <dt>Email</dt>
    <dd><a href="mailto:{{ site.Params.email }}">{{ site.Params.email }}</a></dd>
    <dt>PI Office</dt>
    <dd>{{ site.Params.office }}</dd>
    <dt>Lab</dt>
    <dd>{{ site.Params.labRoom }}</dd>
    <dt>Mailing Address</dt>
    <dd>{{ site.Params.address }}</dd>
  </dl>
  <iframe class="join-map" title="Map of Larsen Hall, University of Florida"
    src="https://www.google.com/maps?q=Larsen+Hall,+University+of+Florida,+Gainesville,+FL&output=embed"
    loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
</article>
{{ end }}
