{{ define "main" }}
<article class="research-page">
  <h1>{{ .Title }}</h1>
  {{ .Content }}
  <div class="research-grid">
    {{ range .Pages.ByWeight }}
    <a class="research-card" href="{{ .RelPermalink }}">
      <h3>{{ .Title }}</h3>
      <p>{{ .Params.summary }}</p>
    </a>
    {{ end }}
  </div>
</article>
{{ end }}
