<footer class="site-footer">
  <div class="wrap footer-inner">
    <p>{{ site.Params.piName }} · {{ site.Params.piTitle }} · {{ site.Params.institution }}</p>
    <p class="footer-links">
      <a href="mailto:{{ site.Params.email }}">{{ site.Params.email }}</a>
      {{ with site.Params.googleScholar }} · <a href="{{ . }}" target="_blank" rel="noopener">Google Scholar</a>{{ end }}
      {{ with site.Params.github }} · <a href="{{ . }}" target="_blank" rel="noopener">GitHub</a>{{ end }}
    </p>
    <p class="footer-copy">&copy; {{ now.Year }} {{ site.Params.labName }}</p>
  </div>
</footer>
