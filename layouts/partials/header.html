<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="{{ site.Home.RelPermalink }}">
      <span class="brand-acronym">{{ site.Params.labAcronym }}</span>
      <span class="brand-name">{{ site.Params.labName }}</span>
    </a>
    <nav class="site-nav">
      <button class="nav-toggle" aria-label="Toggle menu" onclick="document.querySelector('.site-nav ul').classList.toggle('open')">☰</button>
      <ul>
        {{ range site.Menus.main }}
        <li><a href="{{ .URL }}"{{ if or ($.IsMenuCurrent "main" .) ($.HasMenuCurrent "main" .) }} class="active" aria-current="page"{{ end }}>{{ .Name }}</a></li>
        {{ end }}
      </ul>
    </nav>
  </div>
</header>
