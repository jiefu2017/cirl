pi:
  name: "Dr. Jie Fu"
  title: "Associate Professor"
  department: "Department of Electrical and Computer Engineering"
  institution: "University of Florida"
  email: "fujie@ufl.edu"
  bio: >
    Dr. Jie Fu received her M.Sc. in Electrical Engineering and Automation from
    Beijing Institute of Technology (2009) and her Ph.D. in Mechanical Engineering
    from the University of Delaware (2013). She completed postdoctoral work at the
    University of Pennsylvania (2013-2015) and served as an Assistant Professor in
    the Department of Robotics Engineering at Worcester Polytechnic Institute
    (2016-2021) before joining the University of Florida in 2021. Her research
    integrates control theory, machine learning, and formal methods to build
    trustworthy autonomous systems.
